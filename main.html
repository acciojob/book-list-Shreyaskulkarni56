<h1>MyBookList</h1>

<div class="form-group">
    <form>
        <input id="title" type="text">
        <input id="author" type="text">
        <input id="isbn" type="text">
        <button id="submit" type="submit">Submit</button>
    </form>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN#</th>
            <th></th>
        </tr>
    </thead>

    <tbody id="book-list"></tbody>
</table>
